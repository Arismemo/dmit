# Marzban Clash 订阅自定义模板
# 存放路径: /var/lib/marzban/templates/clash/custom.yml
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true

dns:
  enable: true
  ipv6: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.ts.net'
    - localhost.ptlogin2.qq.com
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    # 国内域名用国内 DNS，确保 CDN 调度到最近节点
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

# 过滤掉默认的 proxy-groups、rules 等字段，防止 Jinja2 重复渲染导致 YAML 解析报错
{{ conf | except("proxies", "proxy-groups", "port", "mode", "dns", "mixed-port", "allow-lan", "log-level", "ipv6", "unified-delay", "tcp-concurrent", "geodata-mode", "rules") | yaml | trim }}

proxies:
{%- for proxy in conf.get('proxies', []) %}
- {{ proxy | yaml | indent(2) | trim }}
{%- endfor %}
- name: 'DMIT-HY2'
  type: hysteria2
  server: <SERVER_IP>
  port: 443
  password: '<HY2_PASSWORD>'
  sni: <DOMAIN_NAME>
  skip-cert-verify: false
- name: 'RAK-Bulk-1T'
  type: vless
  server: <RAK_SERVER_IP>
  port: 3389
  uuid: {{ conf.proxies[0].uuid }}
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  client-fingerprint: chrome
  servername: apple.com
  reality-opts:
    public-key: wAgwdEPwgawxCmpFynh7--GzSEExDnFIDNpPa-T6a14
    short-id: abcd1234
  tfo: true
- name: 'AWS-US-Clean'
  type: vless
  server: <AWS_SERVER_IP>
  port: 443
  uuid: {{ conf.proxies[0].uuid }}
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  client-fingerprint: chrome
  servername: apple.com
  reality-opts:
    public-key: wAgwdEPwgawxCmpFynh7--GzSEExDnFIDNpPa-T6a14
    short-id: abcd1234
  tfo: true

proxy-groups:
- name: 'Bulk-Traffic'
  type: 'select'
  proxies:
  - 'RAK-Bulk-1T'
  - 'Proxy'
  - 'DIRECT'

- name: 'Proxy'
  type: 'select'
  proxies:
  - 'Auto'
  - 'DMIT-HY2'
  - 'AWS-US-Clean'
  {{ proxy_remarks | yaml | indent(2) }}

- name: 'Auto'
  type: 'url-test'
  url: 'https://www.gstatic.com/generate_204'
  interval: 300
  tolerance: 50
  proxies:
  - 'DMIT-HY2'
  {{ proxy_remarks | yaml | indent(2) }}

- name: 'AI'
  type: 'select'
  proxies:
  - 'Proxy'
  - 'DMIT-HY2'
  - 'AWS-US-Clean'
  {{ proxy_remarks | yaml | indent(2) }}

- name: 'Grok-xAI'
  type: 'select'
  proxies:
  - 'AWS-US-Clean'
  - 'Proxy'

