# 放进 /etc/nginx/sites-available/dmit-edge 的 static.230254.xyz server 块。
# <PHONE_SUB_PATH> 是随机路径（即访问口令），真实值在本机 secrets.env。
location /<PHONE_SUB_PATH>/ {
    alias /var/www/phone-sub/;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    location ~ /\. { return 404; }
}
