# Clash Verge Rev 推荐核心配置
# 存放路径:
#   macOS: ~/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev/config.yaml
#   Linux: ~/.config/clash-verge-rev/config.yaml
#   Windows: %APPDATA%/io.github.clash-verge-rev.clash-verge-rev/config.yaml

redir-port: 7895
mixed-port: 7897
socks-port: 7898
port: 7899
log-level: warning
allow-lan: true
ipv6: false
mode: rule
external-controller: 127.0.0.1:9097
secret: ""
tun:
  auto-detect-interface: true
  auto-route: true
  device: utun1024
  dns-hijack:
    - any:53
  mtu: 1500
  route-exclude-address: []
  stack: mixed
  strict-route: true
unified-delay: true
